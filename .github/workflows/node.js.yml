# Workflow de CI/CD para Nuxt 4 & Servicos
name: Node.js CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build & Generate Nuxt 4 Site
        run: npm run generate

      - name: Prepare dist directory for deployment compatibility
        run: |
          rm -rf dist
          mkdir -p dist
          cp -r .output/public/. dist/

      # Passo adicionado: Limpar a pasta dist antiga na VPS antes de enviar a nova.
      # Isso evita que arquivos de builds velhos acumulem espaço no servidor.
      - name: Clean old build on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          script: |
            rm -rf ${{ secrets.TARGET }}/dist/*
            rm -rf ${{ secrets.TARGET }}/servico/*

      - name: Publish via SCP
        uses: appleboy/scp-action@master
        with:
          debug: true
          # Uso de ** garante que todos os subdiretórios sejam copiados
          source: "dist/**,servico/**"
          host: ${{ secrets.HOST }}
          port: ${{ secrets.PORT }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSHKEY }}
          use_insecure_cipher: true
          target: ${{ secrets.TARGET }}
          # strip_components foi removido para que as pastas 'dist' e 'servico' entrem intactas